<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a0f1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 220) rotate(45) scale(520 520)">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mouseStroke" x1="512" y1="220" x2="512" y2="820">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="324"/>
    </filter>
    <clipPath id="bgClip">
      <rect x="96" y="96" width="832" height="832" rx="192"/>
    </clipPath>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#bg)"/>
  <g clip-path="url(#bgClip)">
    <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#glow)" filter="url(#glowBlur)"/>
  </g>
  <rect x="96" y="96" width="832" height="832" rx="192" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>
  <g filter="url(#shadow)">
    <rect x="352" y="220" width="320" height="584" rx="160" stroke="url(#mouseStroke)" stroke-width="56"/>
    <line x1="512" y1="340" x2="512" y2="472" stroke="#e2e8f0" stroke-width="56" stroke-linecap="round"/>
  </g>
</svg>
